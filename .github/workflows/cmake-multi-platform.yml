name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: 22
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 15
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux

          # Same setup as your local build: Clang + libstdc++, plain triplet.
          - name: Linux / Clang (libstdc++)
            os: ubuntu-24.04
            compiler: clang
            cc: clang-22
            cxx: clang++-22
            triplet: x64-linux

          # Fallback if Clang + libstdc++ can't do `import std` in CI.
          # Needs the two files from the notes below.
          - name: Linux / Clang (libc++)
            os: ubuntu-24.04
            compiler: clang
            libcxx: true
            cc: clang-22
            cxx: clang++-22
            triplet: x64-linux-libcxx
            experimental: true

          - name: Windows / MSVC
            os: windows-2025
            compiler: msvc
            cc: cl
            cxx: cl
            triplet: x64-windows

          - name: Windows / Clang (clang-cl)
            os: windows-2025
            compiler: clang-cl
            cc: clang-cl
            cxx: clang-cl
            triplet: x64-windows
            experimental: true

    steps:
      - uses: actions/checkout@v4

      # Pin this (e.g. cmakeVersion: "~4.5.0") once it works, for reproducibility.
      - uses: lukka/get-cmake@latest

      # ---------- Linux toolchains ----------
      - name: Install GCC 15
        if: matrix.compiler == 'gcc' || matrix.compiler == 'clang'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-15 g++-15

      - name: Install Clang
        if: matrix.compiler == 'clang'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${LLVM_VERSION}
          sudo apt-get install -y clang-tools-${LLVM_VERSION}
          if [[ "${{ matrix.libcxx }}" == "true" ]]; then
            sudo apt-get install -y libc++-${LLVM_VERSION}-dev libc++abi-${LLVM_VERSION}-dev
          fi

      # ---------- Windows toolchain env ----------
      - name: MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ---------- vcpkg ----------
      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.name }}-

      - name: Prepare vcpkg cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # ---------- Configure / build / test ----------
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          EXTRA=()
          if [[ "${{ matrix.libcxx }}" == "true" ]]; then
            EXTRA+=(
              -DCMAKE_CXX_FLAGS=-stdlib=libc++
              -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
              -DCMAKE_SHARED_LINKER_FLAGS=-stdlib=libc++
              -DVCPKG_OVERLAY_TRIPLETS="$GITHUB_WORKSPACE/cmake/triplets"
            )
          fi

          VCPKG_ROOT_FWD="${VCPKG_INSTALLATION_ROOT//\\//}"

          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_FWD/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ strategy.job-index }}
          path: |
            build/vcpkg_installed/vcpkg/issue_body.md
            build/vcpkg-manifest-install.log
          if-no-files-found: ignore
