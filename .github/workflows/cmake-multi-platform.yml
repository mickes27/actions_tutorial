name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC 15
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc-15
            cxx: g++-15
            triplet: x64-linux

          # Clang + libstdc++ (your local setup). GCC 15 is installed too,
          # so Clang finds libstdc++ 15 headers for `import std`.
          - name: Linux / Clang
            os: ubuntu-24.04
            compiler: clang
            setup_compiler: llvm-22
            cc: clang
            cxx: clang++
            triplet: x64-linux

          - name: Windows / MSVC
            os: windows-2025
            compiler: msvc
            setup_compiler: msvc
            cc: cl
            cxx: cl
            triplet: x64-windows

          - name: Windows / Clang (clang-cl)
            os: windows-2025
            compiler: clang-cl
            setup_compiler: llvm-22
            cc: clang-cl
            cxx: clang-cl
            triplet: x64-windows
            experimental: true

    steps:
      - uses: actions/checkout@v4

      # GCC 15 on Linux: needed by the GCC job, and by the Clang job
      # for its libstdc++ headers.
      - name: Setup GCC 15
        if: runner.os == 'Linux'
        uses: aminya/setup-cpp@v1
        with:
          compiler: gcc-15

      - name: Setup compiler
        if: matrix.compiler != 'gcc'
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.setup_compiler }}
          vcvarsall: ${{ runner.os == 'Windows' }}

      # After setup-cpp, so this CMake comes first on PATH.
      # Fallback if 4.5 isn't found: python -m pip install "cmake~=4.5.0" ninja
      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.5.0-rc3"

      - name: Check tool versions
        run: |
          cmake --version
          ninja --version
          "${{ matrix.cxx }}" --version || true

      - name: vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.os }}-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-${{ matrix.name }}-

      - name: Prepare vcpkg cache dir
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          VCPKG_ROOT_FWD="${VCPKG_INSTALLATION_ROOT//\\//}"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT_FWD/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

      - name: Upload vcpkg logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ strategy.job-index }}
          path: build/vcpkg-manifest-install.log
          if-no-files-found: ignore
